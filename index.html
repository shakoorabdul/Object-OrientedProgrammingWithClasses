<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance Tracker</title>
  <!-- Link external CSS stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h1>Personal Finance Tracker</h1>

  <!-- Top Metrics Summary Cards -->
  <div class="grid">
    <div class="card">
      <h3>Net Balance</h3>
      <p id="net-balance" class="positive">$0.00</p>
    </div>
    <div class="card">
      <h3>Total Income</h3>
      <p id="total-income" class="positive">$0.00</p>
    </div>
    <div class="card">
      <h3>Total Expenses</h3>
      <p id="total-expenses" class="negative">$0.00</p>
    </div>
  </div>

  <!-- Form for Adding New Transactions -->
  <div class="card">
    <h2>Add Transaction</h2>
    <form id="transaction-form">
      <input type="text" id="desc" placeholder="Description (e.g. Grocery)" required />
      <input type="number" step="0.01" id="amount" placeholder="Amount (+50 or -20)" required />
      
      <select id="category">
        <option value="General">General</option>
        <option value="Salary">Salary</option>
        <option value="Food">Food</option>
        <option value="Utilities">Utilities</option>
      </select>

      <input type="date" id="date" required />

      <select id="frequency">
        <option value="">One-time Transaction</option>
        <option value="Weekly">Weekly</option>
        <option value="Monthly">Monthly</option>
      </select>

      <button type="submit">Add Transaction</button>
    </form>
  </div>

  <!-- Transactions List & Filter Section -->
  <div class="card table-card">
    <h2>Transactions List</h2>
    
    <div class="filter-group">
      <label for="filter-category">Filter Category: </label>
      <select id="filter-category">
        <option value="All">All</option>
        <option value="General">General</option>
        <option value="Salary">Salary</option>
        <option value="Food">Food</option>
        <option value="Utilities">Utilities</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Category</th>
          <th>Amount</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="transaction-rows">
        <!-- Rendered dynamically via app.js -->
      </tbody>
    </table>
  </div>

  <!-- Link external JavaScript file -->
  <script src="app.js"></script>
</body>
</html>
